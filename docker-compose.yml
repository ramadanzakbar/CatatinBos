version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: catatin_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-catatin_db}
      MYSQL_USER: ${MYSQL_USER:-catatin_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-catatin_password}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10

  catatin-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: catatin_app
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-catatin_user}:${MYSQL_PASSWORD:-catatin_password}@mysql:3306/${MYSQL_DATABASE:-catatin_db}

volumes:
  mysql_data:
    driver: local
